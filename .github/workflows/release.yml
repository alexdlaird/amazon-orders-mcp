name: Release

run-name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  schema:
    name: Regenerate tool schema
    runs-on: ubuntu-latest

    env:
      FORCE_COLOR: 1
      PYTHONUNBUFFERED: 1

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          skip-token-revoke: true

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: develop

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Regenerate schema
        id: regenerate
        run: |
          make schema
          if git diff --quiet amazonorders_mcp/schema.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit schema to develop (signed)
        if: ${{ steps.regenerate.outputs.changed == 'true' }}
        uses: IAreKyleW00t/verified-bot-commit@v2.3.5
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: alexdlaird/amazon-orders-mcp
          ref: develop
          files: amazonorders_mcp/schema.json
          if-no-commit: error
          message: "Regenerate tool schema"

  prereq:
    needs: [schema]
    uses: alexdlaird/.github/.github/workflows/release-prereq.yml@main
    with:
      version_file: 'amazonorders_mcp/__init__.py'
      version_pattern: 's/^__version__ = ".*"/__version__ = "${VERSION}"/'
      repo_slug: alexdlaird/amazon-orders-mcp
      changelog: true
    secrets:
      bot_app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
      bot_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  build:
    needs: [prereq]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      FORCE_COLOR: 1
      PYTHONUNBUFFERED: 1

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prereq.outputs.squash_commit_sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build package
        run: make local

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  assets:
    needs: [prereq]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      FORCE_COLOR: 1
      PYTHONUNBUFFERED: 1

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prereq.outputs.squash_commit_sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: make install

      - name: Build MCPB bundle
        run: make mcpb PYTHON_BIN=venv/bin/python

      - name: Build MCP Registry server.json
        run: make server-json PYTHON_BIN=venv/bin/python

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            build/amazon-orders-mcp-${{ needs.prereq.outputs.version }}.mcpb
            build/server.json
          if-no-files-found: error

  publish:
    needs: [prereq, build, assets]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/amazon-orders-mcp/${{ needs.prereq.outputs.version }}

    permissions:
      id-token: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  finish:
    needs: [prereq, publish]
    if: always() && needs.prereq.result == 'success'
    uses: alexdlaird/.github/.github/workflows/release-finish.yml@main
    with:
      shipped: ${{ needs.publish.result == 'success' }}
      version: ${{ needs.prereq.outputs.version }}
      squash_commit_sha: ${{ needs.prereq.outputs.squash_commit_sha }}
      squash_boundary_sha: ${{ needs.prereq.outputs.squash_boundary_sha }}
      build_run_id: ${{ needs.prereq.outputs.build_run_id }}
      version_file: 'amazonorders_mcp/__init__.py'
      version_pattern: 's/^__version__ = ".*"/__version__ = "${VERSION}"/'
      repo_slug: alexdlaird/amazon-orders-mcp
      github_release: true
      github_release_notes: ${{ needs.prereq.outputs.release_notes }}
      github_release_run_artifact: release-files
    secrets:
      bot_app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
      bot_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
